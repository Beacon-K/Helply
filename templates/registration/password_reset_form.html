{% extends "base.html" %}{% load static %}
{% block title %}Password reset{% endblock %}
{% block content %}
<div class="login card">
  <img src="{% static 'img/brand/app-icon-256.png' %}" alt="Helply" class="login-logo">
  <h1>Password reset</h1>
  <p class="muted">Enter the email address on your account and we will send you a link to choose a new password.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn primary wide">Send reset link</button>
  </form>
  <p class="small"><a href="{% url 'login' %}">&larr; Back to sign in</a></p>
</div>
{% endblock %}
