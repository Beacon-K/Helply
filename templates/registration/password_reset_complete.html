{% extends "base.html" %}{% load i18n %}{% load static %}
{% block title %}{% trans "Password saved" %}{% endblock %}
{% block content %}
<div class="login card">
  <img src="{% static 'img/brand/app-icon-256.png' %}" alt="{% trans "Helply" %}" class="login-logo">
  <h1>{% trans "All set" %}</h1>
  <p class="muted">{% trans "Your password is saved. You can sign in now." %}</p>
  <a class="btn primary wide" href="{% url 'login' %}">{% trans "Sign in" %}</a>
</div>
{% endblock %}
