{# Technician copilot for one ticket (apps.ai.assistant.copilot). Agents only. #}
<section class="card ai-panel" data-ai-copilot data-url="{% url 'ai:copilot' ticket.pk %}">
  {% csrf_token %}
  <div class="ai-head">
    <span class="ai-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Assistant</span>
    <small class="muted">Summary, likely cause, steps and a draft reply, from this ticket, the requester's history and the knowledge base.</small>
    <button class="btn" type="button" data-run>Analyze this ticket</button>
  </div>
  <div class="ai-out" aria-live="polite" hidden></div>
</section>
