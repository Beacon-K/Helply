{% load i18n %}{# Technician copilot for one ticket (apps.ai.assistant.copilot). Agents only. #}
<section class="card ai-panel" data-ai-copilot data-url="{% url 'ai:copilot' ticket.pk %}">
  {% csrf_token %}
  <div class="ai-head">
    <span class="ai-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-4.5 3.5V17H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>{% trans "Assistant" %}</span>
    <small class="muted">{% trans "Summary, likely cause, steps and a draft reply, from this ticket, the requester's history and the knowledge base." %}</small>
    <button class="btn" type="button" data-run>{% trans "Analyze this ticket" %}</button>
  </div>
  <div class="ai-out" aria-live="polite" hidden></div>
</section>
