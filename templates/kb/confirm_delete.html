{% extends "base.html" %}
{% block title %}Delete article{% endblock %}
{% block content %}
<h1>Delete this article?</h1>
<div class="card narrow">
  <p><b>{{ article.title }}</b></p>
  <p class="muted">This removes the article together with its votes and reader suggestions. It cannot be undone.</p>
  <form method="post">{% csrf_token %}
    <button class="btn primary">Delete article</button>
    <a class="btn" href="{{ article.get_absolute_url }}">Cancel</a>
  </form>
</div>
{% endblock %}
